<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Ops</title>

<style>
:root{
  --bg:#0b0b0b;
  --card:#141414;
  --yellow:#f5c400;
  --text:#f0f0f0;
  --danger:#8b0000;
  --warn:#8a6d00;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family: system-ui, Arial;
}

header{
  padding:16px;
  border-bottom:1px solid #222;
}

h1{
  margin:0;
  font-size:20px;
  color:var(--yellow);
}

#controls{
  padding:12px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

input{
  flex:1;
  min-width:200px;
  background:#000;
  color:var(--text);
  border:1px solid #333;
  padding:10px;
  border-radius:8px;
  font-size:16px;
}

button{
  background:var(--yellow);
  color:#000;
  border:none;
  padding:10px 16px;
  border-radius:8px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

button.alt{
  background:#222;
  color:var(--yellow);
  border:1px solid #333;
}

#selectors{
  padding:10px;
  display:flex;
  gap:8px;
}

#out{
  padding:12px;
}

.card{
  background:var(--card);
  border:1px solid #222;
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
}

.card.critical{ background:var(--danger); }
.card.warn{ background:var(--warn); }

.time{
  color:var(--yellow);
  font-weight:600;
}

.small{
  opacity:.9;
  font-size:14px;
}

/* ===== PDF MODE ===== */
@media print{
  body{ background:#000; }
  header, #controls, #selectors button { display:none; }
  .card{ break-inside:avoid; }
}
</style>
</head>

<body>

<header>
  <h1>🌦️ Weather Ops</h1>
</header>

<div id="controls">
  <input id="coords" placeholder="47.4850929, 34.4614691">
  <button onclick="loadWeather()">Оновити</button>
  <button onclick="savePDF()">📄 PDF</button>
</div>

<div id="selectors" style="display:none">
  <button class="alt" onclick="showType('FPV')">FPV</button>
  <button class="alt" onclick="showType('Mavic')">Mavic</button>
  <button class="alt" onclick="showType('Крила')">Крило</button>
</div>

<div id="out"></div>

<script>
// ============ НАСТРОЙКИ ============
const API_KEY = "dd4a4a999979668585619cc1bc113083";

const ALT = {
  FPV:[{h:100,m:1.2},{h:200,m:1.35}],
  Mavic:[{h:200,m:1.35},{h:500,m:1.6}],
  Крила:[{h:800,m:1.9},{h:1500,m:2.3}]
};

let DATA=null;
let LAST_HTML="";

// ============ ЛОГІКА ============
async function loadWeather(){
  const c=document.getElementById("coords").value.split(",");
  if(c.length!=2) return alert("Формат: lat, lon");

  const lat=c[0].trim();
  const lon=c[1].trim();

  document.getElementById("out").innerHTML="⏳ Завантаження...";
  const url=`https://api.openweathermap.org/data/3.0/onecall?lat=${lat}&lon=${lon}&units=metric&exclude=minutely,daily&appid=${API_KEY}`;
  const r=await fetch(url);
  DATA=await r.json();

  document.getElementById("selectors").style.display="flex";
  document.getElementById("out").innerHTML="⬆️ Обери засіб";
}

function status(w,g,r,v){
  if(w>12||g>12||r>3||v<2000) return "critical";
  if(w>8||g>8) return "warn";
  return "";
}

function showType(type){
  const hours=[0,1,2,3,4];
  const genTime=new Date().toLocaleString("uk-UA");

  let html=`<h2 style="color:var(--yellow)">${type} — 5 год вперед</h2>
  <div class="small">📍 ${document.getElementById("coords").value} | 🕒 ${genTime}</div><br>`;

  hours.forEach(h=>{
    const H=DATA.hourly[h];
    const time=new Date(H.dt*1000).toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"});

    ALT[type].forEach(a=>{
      const w=H.wind_speed*a.m;
      const g=(H.wind_gust||H.wind_speed)*a.m;
      const r=H.rain?.["1h"]||0;
      const v=H.visibility||10000;
      const s=status(w,g,r,v);

      html+=`
      <div class="card ${s}">
        <div class="time">${time} | ${a.h} м</div>
        <div class="small">
          🌡️ ${H.temp.toFixed(1)}°C<br>
          💨 ${w.toFixed(1)} / ${g.toFixed(1)} м/с<br>
          🧭 ${H.wind_deg}°<br>
          🌧️ ${r>0?r+" мм":"—"}<br>
          <b>${s=="critical"?"🔴 НЕ МОЖНА":s=="warn"?"🟡 ОБМЕЖЕНО":"🟢 МОЖНА"}</b>
        </div>
      </div>`;
    });
  });

  LAST_HTML=html;
  document.getElementById("out").innerHTML=html;
}

// ============ PDF ============
function savePDF(){
  const w=window.open("");
  w.document.write(`
  <html>
  <head>
    <title>Weather Ops — PDF</title>
    <style>${document.querySelector("style").innerHTML}</style>
  </head>
  <body>${LAST_HTML}</body>
  </html>
  `);
  w.document.close();
  w.focus();
  w.print();
}
</script>

</body>
</html>
